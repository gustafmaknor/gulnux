# Nätverksmenyn i panelen: wifi-nät i fuzzel, samma utseende som programstartaren.
# Ikonen i panelen stänger menyn om den redan är öppen (fuzzel kan bara köras en gång).
[dmenu]
dmenu_command = fuzzel
prompt = Nätverk
format = {name}  {icon}
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
active_chars = ✓
list_saved = False

[dmenu_passphrase]
obscure = True

[editor]
terminal = foot
gui_if_available = True
